<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>自适应检查</title>
  <style>
    body { margin: 0; background: #111; color: #ddd; font: 13px system-ui, sans-serif; }
    .row { display: flex; gap: 12px; padding: 12px; align-items: flex-start; flex-wrap: wrap; }
    .box { background: #000; border: 1px solid #444; }
    .box h3 { margin: 0; padding: 4px 8px; font-size: 12px; font-weight: 400; color: #8ab; background: #1b1b22; }
    iframe { display: block; border: 0; }
  </style>
</head>
<body>
  <div class="row">
    <div class="box">
      <h3>1280 × 720</h3>
      <iframe src="newtab.html?t=1280" width="1280" height="720"></iframe>
    </div>
  </div>
  <div class="row">
    <div class="box">
      <h3>1024 × 600</h3>
      <iframe src="newtab.html?t=1024" width="1024" height="600"></iframe>
    </div>
    <div class="box">
      <h3>640 × 480</h3>
      <iframe src="newtab.html?t=640" width="640" height="480"></iframe>
    </div>
    <div class="box">
      <h3>390 × 700 (手机)</h3>
      <iframe src="newtab.html?t=390" width="390" height="700"></iframe>
    </div>
  </div>
</body>
</html>
